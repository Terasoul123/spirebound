<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spirebound — nightsergio</title>
<meta name="description" content="Spirebound — пікселе підземелля зі зброєю та босами. Скоро на Google Play і Steam. Дерево прогресу, новини, підтримка.">
<meta property="og:title" content="Spirebound">
<meta property="og:description" content="Pixel dungeon game. Coming to Google Play and Steam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--stone:#17303a;--deep:#0f2229;--bone:#efe6d2;--rust:#d2502f;--gold:#f0bd3c;--dim:#35505b;--line:rgba(239,230,210,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--stone);color:var(--bone);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Pixelify Sans',monospace;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:var(--deep);border-bottom:2px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:10px}
nav b{font:700 20px 'Pixelify Sans',monospace}
.links a{margin-right:14px;text-decoration:none;font-weight:600;font-size:15px}
.links a:hover{color:var(--gold)}
.lang button{font:700 14px 'Pixelify Sans',monospace;background:none;color:var(--bone);border:2px solid var(--line);padding:3px 7px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.hero{padding:64px 0;background:var(--deep);border-bottom:6px solid var(--rust)}
.hero h1{font-size:clamp(48px,11vw,96px);margin-bottom:14px}
.hero p{max-width:48ch;margin:0 0 24px;font-size:19px}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.badge{padding:8px 14px;border:3px solid var(--gold);color:var(--gold);font:700 16px 'Pixelify Sans',monospace}
.btn{display:inline-block;padding:13px 20px;font:700 18px 'Pixelify Sans',monospace;text-decoration:none;border:3px solid var(--bone);background:var(--rust);color:var(--bone);box-shadow:5px 5px 0 var(--bone);cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--bone)}
section{padding:60px 0}
h2{font-size:clamp(30px,6vw,44px);margin-bottom:10px}
.sub{margin:0 0 28px;opacity:.8;max-width:60ch}
.alt{background:var(--deep)}
.video{position:relative;aspect-ratio:16/9;border:4px solid var(--bone);box-shadow:8px 8px 0 var(--rust);background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.segs{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:6px 0 8px}
.segs i{height:22px;background:var(--dim);border:2px solid var(--deep)}
.segs i.on{background:var(--gold)}
.count{font:700 28px 'Pixelify Sans',monospace;margin-bottom:24px}
.vp{height:min(78vh,680px);overflow:auto;border:3px solid var(--line);background:var(--deep);overscroll-behavior:contain}
.tree{position:relative;display:flex;flex-direction:column-reverse;padding:40px 0 40px;gap:26px}
.trunk,.fill{position:absolute;bottom:0;width:8px;left:50%;margin-left:-4px}
.trunk{top:0;background:var(--dim)}
.fill{background:var(--gold);box-shadow:0 0 14px rgba(240,189,60,.6)}
.n{position:relative;width:50%}
.n.l{align-self:flex-start;padding-right:40px;text-align:right}
.n.r{align-self:flex-end;padding-left:40px}
.n::before{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;background:var(--dim)}
.n.l::before{right:0;width:40px}
.n.r::before{left:0;width:40px}
.n.done::before{background:var(--gold)}
.dot{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;background:var(--deep);border:4px solid var(--dim)}
.n.l .dot{right:-11px}.n.r .dot{left:-11px}
.n.done .dot{background:var(--gold);border-color:var(--bone)}
.card{display:inline-block;max-width:100%;padding:12px 16px;background:var(--stone);border:3px solid var(--dim)}
.card h3{font-size:19px}
.card small{opacity:.7}
.n.done .card{border-color:var(--gold)}
.n.todo .card{border-style:dashed;border-color:var(--bone)}
.n.empty .card{border-style:dotted;opacity:.45}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px;opacity:.85}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;background:var(--gold)}
.legend span:nth-child(2)::before{background:none;border:2px dashed var(--bone)}
.legend span:nth-child(3)::before{background:none;border:2px dotted var(--bone)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tier{padding:22px;border:3px solid var(--bone);display:flex;flex-direction:column;gap:12px}
.tier.main{background:var(--bone);color:var(--deep)}
.tier h3{font-size:24px}
.tier p{margin:0}
.card-num{font:700 clamp(20px,5vw,28px) 'Pixelify Sans',monospace;letter-spacing:.06em;word-break:break-all}
.tier .btn{text-align:center;font-size:16px;padding:10px 14px;box-shadow:4px 4px 0 var(--bone)}
.tier.main .btn{border-color:var(--deep);box-shadow:4px 4px 0 var(--deep)}
footer{padding:30px 0;background:var(--deep);text-align:center;font-size:15px}
footer a{margin:0 10px}
@media (max-width:700px){
 .trunk,.fill{left:16px;margin-left:0}
 .n,.n.l,.n.r{width:100%;align-self:stretch;text-align:left;padding:0 0 0 56px}
 .n.l::before,.n.r::before{left:20px;right:auto;width:36px}
 .n.l .dot,.n.r .dot{left:9px;right:auto}
 .links a{margin-right:9px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
<body>

<script>
var T={
uk:{nAbout:"Про гру",nGoals:"Цілі",nSupport:"Підтримка",tag:"Піксельне підземелля зі зброєю та босами. Гру робить один розробник.",soon:"Скоро",cta:"Підтримати гру",aboutH:"Про гру",aboutP:"Spirebound — це гра про спуск у підземелля та підйом на вежу. Ти збираєш зброю, б'єшся з ворогами та босами. Гра виходить на Android (Google Play) і ПК (Steam).",vidH:"Геймплей",vidB:"Дивитись на YouTube",goalsH:"Дерево прогресу",goalsP:"Це мапа розробки. Жовтим залите все, що вже зроблено. Гортай угору, щоб побачити, що буде далі.",locs:"Локації:",lDone:"Готово",lTodo:"У планах",lEmpty:"Ще без цілі",supH:"Підтримати гру",supP:"Кожна гривня йде на розробку: нові локації, зброю й озвучення.",monoH:"Картка monobank",copy:"Скопіювати номер",copied:"Скопійовано",daP:"Донат з будь-якої країни.",daB:"Відкрити DonationAlerts",newsH:"Новини",newsP:"Усі новини розробки виходять у Telegram. Відео з гри дивись у TikTok."},
ru:{nAbout:"Об игре",nGoals:"Цели",nSupport:"Поддержка",tag:"Пиксельное подземелье с оружием и боссами. Игру делает один разработчик.",soon:"Скоро",cta:"Поддержать игру",aboutH:"Об игре",aboutP:"Spirebound — это игра про спуск в подземелье и подъём на башню. Ты собираешь оружие, сражаешься с врагами и боссами. Игра выйдет на Android (Google Play) и ПК (Steam).",vidH:"Геймплей",vidB:"Смотреть на YouTube",goalsH:"Дерево прогресса",goalsP:"Это карта разработки. Жёлтым залито всё, что уже сделано. Листай вверх, чтобы увидеть, что будет дальше.",locs:"Локации:",lDone:"Готово",lTodo:"В планах",lEmpty:"Пока без цели",supH:"Поддержать игру",supP:"Каждая гривна идёт на разработку: новые локации, оружие и озвучку.",monoH:"Карта monobank",copy:"Скопировать номер",copied:"Скопировано",daP:"Донат из любой страны.",daB:"Открыть DonationAlerts",newsH:"Новости",newsP:"Все новости разработки выходят в Telegram. Видео из игры смотри в TikTok."},
en:{nAbout:"About",nGoals:"Goals",nSupport:"Support",tag:"A pixel dungeon game with weapons and bosses. Made by one developer.",soon:"Coming soon",cta:"Support the game",aboutH:"About the game",aboutP:"Spirebound is about going down into the dungeon and climbing the tower. You collect weapons, fight enemies and bosses. The game is coming to Android (Google Play) and PC (Steam).",vidH:"Gameplay",vidB:"Watch on YouTube",goalsH:"Progress tree",goalsP:"This is the development map. Everything already done is filled in yellow. Scroll up to see what comes next.",locs:"Locations:",lDone:"Done",lTodo:"Planned",lEmpty:"No goal yet",supH:"Support the game",supP:"Every donation goes into development: new locations, weapons and sound.",monoH:"monobank card",copy:"Copy number",copied:"Copied",daP:"Donate from any country.",daB:"Open DonationAlerts",newsH:"News",newsP:"All development news is posted on Telegram. Watch gameplay clips on TikTok."}
};
function L(n){return["Локація "+n,"Локация "+n,"Location "+n]}
var nodes=[
{k:"done",t:["Початок розробки","Начало разработки","Development begins"]},
{k:"done",t:["Перша локація","Первая локация","First location"]},
{k:"done",t:["Перший бос","Первый босс","First boss"]},
{k:"done",t:["Перші 4 локації","Первые 4 локации","First 4 locations"]},
{k:"done",t:["Додано 30 зброї","Добавлено 30 видов оружия","30 weapons added"]},
{k:"todo",t:L(5)},{k:"todo",t:L(6)},{k:"todo",t:L(7)},{k:"todo",t:L(8)},
{k:"todo",t:L(9)},{k:"todo",t:L(10)},{k:"todo",t:L(11)},{k:"todo",t:L(12)},
{k:"empty"},{k:"empty"},{k:"empty"}
];
var lang="uk";
try{lang=localStorage.getItem("lang")||""}catch(e){}
if(!T[lang]){var p=(navigator.languages&&navigator.languages[0]||navigator.language||"en").toLowerCase();lang=p.indexOf("uk")==0?"uk":p.indexOf("ru")==0?"ru":"en"}
var ix={uk:0,ru:1,en:2};
function render(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=T[lang][e.dataset.i]});
 document.querySelectorAll("[data-l]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l==lang)});
 document.querySelectorAll(".n").forEach(function(e){e.remove()});
 var tree=document.getElementById("tree");
 nodes.forEach(function(n,i){
  var d=document.createElement("div");d.className="n "+n.k+" "+(i%2?"l":"r");
  d.innerHTML='<span class="dot"></span><div class="card"><h3>'+(n.t?n.t[ix[lang]]:"???")+'</h3></div>';
  tree.appendChild(d);
 });
 fillTree();
}
function fillTree(){
 var tree=document.getElementById("tree"),all=tree.querySelectorAll(".n.done"),last=all[all.length-1];
 if(last)document.getElementById("fill").style.height=(tree.offsetHeight-(last.offsetTop+last.offsetHeight/2))+"px";
}
var s=document.getElementById("segs");
for(var i=0;i<12;i++){var e=document.createElement("i");if(i<4)e.className="on";s.appendChild(e)}
document.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}render()}});
document.getElementById("copy").onclick=function(){
 var b=this,num="4874070012319479";
 function ok(){b.textContent=T[lang].copied;setTimeout(function(){b.textContent=T[lang].copy},1800)}
 try{navigator.clipboard.writeText(num).then(ok)}catch(e){var r=document.createRange();r.selectNodeContents(document.getElementById("cn"));var sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
};
render();
var vp=document.getElementById("vp");vp.scrollTop=vp.scrollHeight;
window.addEventListener("resize",fillTree);
</script>
